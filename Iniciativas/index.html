<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priorización Riesgos 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202E; --muted:#5B6675; --line:#D5DBE2;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --alta:#B42318; --media:#A66A10; --baja:#3F6497;
  --alta-bg:#FDECEA; --media-bg:#FBF1DF; --baja-bg:#E8EEF7;
  --empty:#E3E7EC;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1520; --surface:#18202D; --ink:#E6EAF0; --muted:#9AA5B4; --line:#2A3445;
    --accent:#7C98FF; --accent-ink:#0F1520; --accent-soft:#1F2A47;
    --alta:#F07167; --media:#E3B04B; --baja:#86A8DA;
    --alta-bg:#3A1D1D; --media-bg:#382D16; --baja-bg:#1C2A40;
    --empty:#232C3A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1520; --surface:#18202D; --ink:#E6EAF0; --muted:#9AA5B4; --line:#2A3445;
  --accent:#7C98FF; --accent-ink:#0F1520; --accent-soft:#1F2A47;
  --alta:#F07167; --media:#E3B04B; --baja:#86A8DA;
  --alta-bg:#3A1D1D; --media-bg:#382D16; --baja-bg:#1C2A40;
  --empty:#232C3A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header.intro{padding:40px 0 24px}
header.intro h1{font-size:clamp(28px,4.2vw,44px);line-height:1.08;letter-spacing:-0.02em;font-weight:700;margin:0 0 12px;max-width:22ch}
header.intro p{margin:0;color:var(--muted);max-width:62ch;font-size:17px}
.pulse{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.pulse div{display:flex;flex-direction:column}
.pulse strong{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pulse span{color:var(--muted);font-size:14px;margin-top:4px}

.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:14px;font-weight:500}
.facil{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.facil label{display:flex;gap:6px;align-items:center;cursor:pointer}

main{padding:28px 0 80px}
.notice{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:15px}
section.frente{margin-bottom:36px}
section.frente h2{font-size:20px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
section.frente h2 .count{font-size:14px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto 170px;gap:8px 24px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.txt{margin:0;font-size:16px;max-width:70ch}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.niif{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.src{font-size:12.5px;color:var(--muted)}
.actions{display:inline-flex;gap:4px;margin-left:4px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:2px 4px}

.vote{display:inline-flex;gap:6px}
.vote button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;min-width:62px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.vote button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.vote button[data-p="A"][aria-pressed="true"]{background:var(--alta-bg);border-color:var(--alta);color:var(--alta)}
.vote button[data-p="M"][aria-pressed="true"]{background:var(--media-bg);border-color:var(--media);color:var(--media)}
.vote button[data-p="B"][aria-pressed="true"]{background:var(--baja-bg);border-color:var(--baja);color:var(--baja)}
.vote button:disabled{cursor:not-allowed;opacity:.55}

.dist{display:flex;flex-direction:column;gap:6px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--empty)}
.stack span{display:block;height:100%}
.stack .a{background:var(--alta)} .stack .m{background:var(--media)} .stack .b{background:var(--baja)}
.dist small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.agreed{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.agreed select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--surface);font-size:13px}
.pill{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.pill.A{background:var(--alta-bg);color:var(--alta)} .pill.M{background:var(--media-bg);color:var(--media)} .pill.B{background:var(--baja-bg);color:var(--baja)}

/* Resultados */
.rank .item{grid-template-columns:40px minmax(0,1fr) 260px 150px}
.pos{font-size:22px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .stack{height:14px;border-radius:7px}
.score{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.fr{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.hidden-box{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 24px;color:var(--muted)}

dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,21,32,.45)}
.dlg{padding:24px}
.dlg h3{margin:0 0 16px;font-size:20px}
.field{margin-bottom:16px}
.field > label,.field > .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input[type=text],.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg)}
.field textarea{min-height:90px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.err{color:var(--alta);font-size:14px;min-height:1em;margin:0 0 8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}

@media (max-width:820px){
  .item{grid-template-columns:1fr;gap:12px}
  .rank .item{grid-template-columns:32px minmax(0,1fr)}
  .rank .item .dist,.rank .item .agreed{grid-column:2}
  .vote button{flex:1}
  .vote{display:flex}
  .filters{flex-basis:100%;order:3}
}
@media (prefers-reduced-motion:no-preference){
  .stack span{transition:width .35s ease}
}
</style>
</head>
<body>
<header class="intro"><div class="wrap">
  <h1>¿Qué priorizamos en Riesgos para 2027?</h1>
  <p>Votá la prioridad de cada iniciativa. Los resultados se actualizan para todo el equipo. Si falta algo, agregalo: la idea es armar el plan entre todos.</p>
  <div class="pulse" id="pulse"></div>
</div></header>

<div class="bar-top"><div class="wrap">
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-view="votar" aria-pressed="true">Votar</button>
    <button type="button" data-view="resultados" aria-pressed="false">Resultados</button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filtrar por frente"></div>
  <div class="facil" id="facil"></div>
  <button type="button" class="btn small" id="csvBtn" hidden>Descargar CSV</button>
  <button type="button" class="btn primary" id="addBtn">Agregar iniciativa</button>
</div></div>

<main><div class="wrap" id="main"><p class="empty">Cargando iniciativas…</p></div></main>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h3 id="dlgTitle">Agregar iniciativa</h3>
    <div class="field">
      <label for="fFrente">Frente</label>
      <input type="text" id="fFrente" list="frentesList" placeholder="Ej.: Scores" required maxlength="60">
      <datalist id="frentesList"></datalist>
    </div>
    <div class="field">
      <label for="fTexto">Iniciativa</label>
      <textarea id="fTexto" required maxlength="500" placeholder="Qué haríamos y para qué"></textarea>
    </div>
    <div class="field">
      <span class="lbl">Impulsor</span>
      <div class="checks" id="fImp"></div>
    </div>
    <p class="err" id="fErr"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="cancelBtn">Cancelar</button>
      <button type="submit" class="btn primary" id="saveBtn">Agregar</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  const P = {A:{label:"Alta",w:3,cls:"a"},M:{label:"Media",w:2,cls:"m"},B:{label:"Baja",w:1,cls:"b"}};
  const ORDER = ["A","M","B"];
  const IMPULSORES = ["NIIF 9","Finanzas abiertas","Negocio","Riesgos","Cobranzas","Eficiencia"];
  const FRENTES_BASE = ["Datos y KPIs","Scores","Políticas","Automatización"];
  // URL de la implementación de Apps Script (termina en /exec)
  const API = "https://script.google.com/macros/s/AKfycbwzwKUZhFx_deiYDCRPkoE9FcX2j3D1PW2TEP4LLv1STovlQ7JI_n8SkVxWRMcj_-o_7Q/exec";
  const POLL_MS = 8000;
  const SEED = [
    ["Datos y KPIs","Seguimiento y mejora del trade-off entre tasa de aprobación y mora. Búsqueda de oportunidades en la política para mejorar la colocación de TC y préstamos, incorporando pérdida esperada y rentabilidad ajustada por riesgo.",[]],
    ["Datos y KPIs","Monitorear métricas asociadas a la política y procesos de alta y la calidad crediticia de la cartera originada.",[]],
    ["Datos y KPIs","Preparar la infraestructura de datos para incorporar información externa (open banking) bajo mecanismos de consentimiento y trazabilidad.",["Finanzas abiertas"]],
    ["Datos y KPIs","Fortalecer la gestión y gobierno de datos, consolidando información histórica de originación, mora y recupero, con criterios unificados y trazabilidad para mejorar el monitoreo del riesgo y la estimación de pérdidas esperadas.",[]],
    ["Scores","Implementación del score de comportamiento en los distintos sistemas del banco para automatizar su cálculo y utilización para fines comerciales y para anticipar el deterioro de la cartera (score necesario para NIIF y finanzas abiertas).",["NIIF 9","Finanzas abiertas"]],
    ["Scores","Monitorear la performance de los modelos y evaluar recalibraciones: estabilidad del poder predictivo según umbrales definidos, estabilidad de variables e inclusión de variables de finanzas abiertas para mejorar la capacidad predictiva.",["Finanzas abiertas"]],
    ["Scores","Evaluar la cobertura y precisión del predictor de ingresos en trabajadores dependientes e independientes y en distintos canales para definir ajustes y ampliar su uso incorporando nuevas fuentes de información (open banking).",["Finanzas abiertas"]],
    ["Scores","Desarrollar modelos de pérdida esperada integrando PD, LGD, EAD y escenarios prospectivos.",[]],
    ["Políticas","Implementación manual y automática del mantenimiento de límite en los sistemas. Monitoreo continuo y ajustes considerando impacto comercial, riesgo, pérdida esperada y utilización.",[]],
    ["Políticas","Analizar rechazos y caídas de precalificados; ajustar criterios y evaluar datos adicionales para incorporar nuevos clientes de forma controlada.",[]],
    ["Políticas","Utilizar el score de comportamiento para identificar oportunidades de cross selling entre tarjetas y préstamos, ajustando las ofertas al perfil de riesgo de cada cliente.",[]],
    ["Políticas","Desarrollo del equipo responsable de la gestión de riesgos, separado del negocio para evitar oposición de intereses y como célula aparte para gestionar nuevos cambios regulatorios y su impacto en la gestión integral de riesgos.",[]],
    ["Automatización","Implementación del scoring de préstamos sin retención en sucursales de manera manual o automatizada.",[]],
    ["Automatización","Implementación de un score estandarizado en los distintos canales.",[]],
    ["Automatización","Implementar un motor único de riesgos y cobranzas que automatice las políticas de crédito a lo largo del ciclo de vida del cliente y permita monitorear y optimizar la cartera de forma centralizada.",[]],
    ["Automatización","Integrar la gestión de consentimiento en los journeys del banco, asegurando trazabilidad y cumplimiento regulatorio (open banking).",["Finanzas abiertas"]]
  ].map(([frente,texto,impulsores],i)=>({id:"i"+(i+1),frente,texto,impulsores,origen:"inicial",orden:i+1}));

  const st = {
    status:"loading", items:SEED, added:[], votes:{}, voters:0, agreed:{}, hide:false,
    uid:null, clave:"", canEdit:false, view:"votar", frente:"Todos", editingId:null
  };
  let pending=0, mine={};

  const $ = (s,el=document)=>el.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function toast(msg){
    const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(),3800);
  }

  // ---------- API (Google Sheet vía Apps Script) ----------
  async function api(accion, data){
    // text/plain evita el preflight CORS, que Apps Script no responde
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({accion, uid:st.uid, clave:st.clave}, data||{}))});
    const j = await r.json();
    if(!j.ok) throw Object.assign(new Error(j.error), {code:j.error});
    apply(j.estado);
    return j;
  }
  function apply(e){
    st.added = e.iniciativas.map(i=>Object.assign(i,{origen:"taller"}));
    st.items = SEED.concat(st.added.sort((a,b)=>a.orden-b.orden));
    st.votes = e.votos;
    if(pending) st.votes[st.uid] = Object.assign({}, mine);
    else mine = Object.assign({}, st.votes[st.uid]||{});
    st.voters = e.votantes; st.agreed = e.acuerdos; st.hide = e.ocultos; st.canEdit = e.facilitador;
    st.status = "ready"; render();
  }
  async function refresh(){
    if(document.hidden || pending) return;
    try{ await api("estado"); }
    catch(e){ if(st.status!=="ready"){ st.status="error"; render(); } }
  }

  function storage(k, v){
    try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){}
    return null;
  }
  function identity(){
    let uid = storage("riesgos2027-uid");
    if(!uid){
      uid = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12));
      storage("riesgos2027-uid", uid);
    }
    st.uid = uid;
    // Modo facilitador: abrir la página con ?facilitador=CLAVE una vez; la clave queda en este navegador
    const q = new URLSearchParams(location.search);
    if(q.has("facilitador")){
      storage("riesgos2027-clave", q.get("facilitador"));
      q.delete("facilitador");
      history.replaceState(null, "", location.pathname + (q.toString() ? "?"+q : "") + location.hash);
    }
    st.clave = storage("riesgos2027-clave") || "";
  }

  // ---------- derived ----------
  function tally(id){
    const c={A:0,M:0,B:0};
    for(const uid in st.votes){ const p=(st.votes[uid]||{})[id]; if(c[p]!==undefined) c[p]++; }
    const n=c.A+c.M+c.B;
    const avg = n ? (c.A*3+c.M*2+c.B*1)/n : 0;
    return {c,n,avg};
  }
  function frentes(){
    const set=[...FRENTES_BASE];
    st.items.forEach(i=>{ if(i.frente && !set.includes(i.frente)) set.push(i.frente); });
    return set;
  }
  function showResults(){ return !st.hide || st.canEdit; }
  function canDelete(it){ return it.origen==="taller" && (st.canEdit || it.mia); }

  // ---------- render ----------
  function render(){
    const active=document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
    renderPulse(); renderFilters(); renderFacil(); renderMain();
    document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.view===st.view)));
    $("#addBtn").disabled = st.status!=="ready";
    $("#csvBtn").hidden = st.status!=="ready" || !showResults();
    if(active){ const el=document.querySelector('[data-fk="'+CSS.escape(active)+'"]'); if(el) el.focus(); }
  }

  function renderPulse(){
    const n=st.items.length, v=st.voters, own=Object.keys(mine).filter(k=>st.items.some(i=>i.id===k)).length;
    const agreed=Object.keys(st.agreed).filter(k=>st.items.some(i=>i.id===k)).length;
    $("#pulse").innerHTML = st.status!=="ready" ? "" :
      '<div><strong>'+n+'</strong><span>iniciativas</span></div>'+
      '<div><strong>'+v+'</strong><span>'+(v===1?"persona votó":"personas votaron")+'</span></div>'+
      '<div><strong>'+own+' de '+n+'</strong><span>tus votos</span></div>'+
      '<div><strong>'+agreed+'</strong><span>prioridades acordadas</span></div>';
  }

  function renderFilters(){
    const list=["Todos",...frentes().filter(f=>st.items.some(i=>i.frente===f))];
    if(!list.includes(st.frente)) st.frente="Todos";
    $("#filters").innerHTML = list.map(f=>'<button type="button" class="chip" data-fk="f:'+esc(f)+'" data-frente="'+esc(f)+'" aria-pressed="'+(f===st.frente)+'">'+esc(f)+'</button>').join("");
    $("#frentesList").innerHTML = frentes().map(f=>'<option value="'+esc(f)+'">').join("");
  }

  function renderFacil(){
    const el=$("#facil");
    if(!st.canEdit || st.status!=="ready"){ el.innerHTML=""; return; }
    el.innerHTML='<label title="Los participantes no ven los resultados hasta que los muestres"><input type="checkbox" id="hideChk" data-fk="hide" '+(st.hide?"checked":"")+'> Ocultar resultados al equipo</label>';
  }

  function voteButtons(it){
    const own=mine[it.id];
    return '<div class="vote" role="group" aria-label="Tu voto para esta iniciativa">'+ORDER.map(p=>
      '<button type="button" data-fk="v:'+esc(it.id)+':'+p+'" data-vote="'+esc(it.id)+'" data-p="'+p+'" aria-pressed="'+(own===p)+'">'+P[p].label+'</button>').join("")+'</div>';
  }
  function distBlock(it, withAvg){
    if(!showResults()) return '<div class="dist"><small>Resultados ocultos por ahora</small></div>';
    const t=tally(it.id);
    const pct=p=> t.n? (t.c[p]/t.n*100).toFixed(1):0;
    const label = t.n ? (t.c.A+" alta, "+t.c.M+" media, "+t.c.B+" baja") : "Sin votos todavía";
    return '<div class="dist"><div class="stack" role="img" aria-label="'+esc(label)+'">'+ORDER.map(p=>'<span class="'+P[p].cls+'" style="width:'+pct(p)+'%"></span>').join("")+'</div>'+
      '<small>'+(withAvg && t.n?'<span class="score">'+t.avg.toFixed(1).replace(".",",")+'</span> de 3, ':'')+(t.n?(t.n+(t.n===1?" voto":" votos")):"Sin votos todavía")+'</small></div>';
  }
  function agreedBlock(it){
    const a=st.agreed[it.id];
    if(st.canEdit){
      return '<div class="agreed"><label for="ag-'+esc(it.id)+'">Acordada</label><select id="ag-'+esc(it.id)+'" data-fk="ag:'+esc(it.id)+'" data-agree="'+esc(it.id)+'"><option value="">Sin definir</option>'+
        ORDER.map(p=>'<option value="'+p+'" '+(a===p?"selected":"")+'>'+P[p].label+'</option>').join("")+'</select></div>';
    }
    return a ? '<div class="agreed">Acordada <span class="pill '+a+'">'+P[a].label+'</span></div>' : '';
  }
  function meta(it, withFrente){
    const tags=(it.impulsores||[]).map(t=>'<span class="tag'+(t==="NIIF 9"?" niif":"")+'">'+esc(t)+'</span>').join("");
    const src = it.origen==="taller" ? '<span class="src">'+(it.mia?"Agregada por vos":"Sumada en el taller")+'</span>' : '';
    const acts = canDelete(it) ? '<span class="actions"><button type="button" class="link" data-fk="e:'+esc(it.id)+'" data-edit="'+esc(it.id)+'">Editar</button><button type="button" class="link" data-fk="d:'+esc(it.id)+'" data-del="'+esc(it.id)+'">Eliminar</button></span>' : '';
    return '<div class="meta">'+tags+src+acts+'</div>';
  }

  function renderMain(){
    const m=$("#main");
    if(st.status==="nocfg"){ m.innerHTML='<p class="empty">Falta configurar la URL de Apps Script en la página.</p>'; return; }
    if(st.status==="error"){ m.innerHTML='<p class="empty">No se pudieron cargar los votos. Recargá la página para volver a intentar.</p>'; return; }
    if(st.status!=="ready"){ m.innerHTML='<p class="empty">Cargando iniciativas…</p>'; return; }
    const note="";

    const items = st.items.filter(i=>st.frente==="Todos"||i.frente===st.frente);
    if(!st.items.length){ m.innerHTML=note+'<div class="empty">Todavía no hay iniciativas. Usá Agregar iniciativa para sumar la primera.</div>'; return; }

    if(st.view==="votar"){
      const groups = frentes().filter(f=>items.some(i=>i.frente===f));
      m.innerHTML = note + groups.map(f=>{
        const its=items.filter(i=>i.frente===f);
        return '<section class="frente"><h2>'+esc(f)+'<span class="count">'+its.length+'</span></h2><div class="list">'+
          its.map(it=>'<article class="item"><div><p class="txt">'+esc(it.texto)+'</p>'+meta(it)+'</div>'+voteButtons(it)+'<div>'+distBlock(it,false)+agreedBlock(it)+'</div></article>').join("")+
          '</div></section>';
      }).join("");
    } else {
      if(!showResults()){ m.innerHTML = note+'<div class="hidden-box">El facilitador va a mostrar los resultados cuando termine la votación.</div>'; return; }
      const ranked = items.map(it=>({it,t:tally(it.id)})).sort((a,b)=>(b.t.avg-a.t.avg)||(b.t.n-a.t.n)||(a.it.orden||0)-(b.it.orden||0));
      m.innerHTML = note + '<section class="frente rank"><h2>Ranking por voto del equipo<span class="count">Alta vale 3, Media 2 y Baja 1</span></h2><div class="list">'+
        ranked.map((r,i)=>'<article class="item"><span class="pos">'+(i+1)+'</span><div><div class="fr">'+esc(r.it.frente)+'</div><p class="txt">'+esc(r.it.texto)+'</p>'+meta(r.it)+'</div>'+distBlock(r.it,true)+agreedBlock(r.it)+'</article>').join("")+
        '</div></section>';
    }
  }

  // ---------- writes ----------
  async function vote(id,p){
    if(mine[id]===p) delete mine[id]; else mine[id]=p;
    st.votes[st.uid]=Object.assign({},mine); render();
    pending++;
    try{ await api("votar",{item:id, p:mine[id]||""}); }
    catch(e){ toast("Tu voto no se guardó. Probá de nuevo en unos segundos."); pending--; pending||refresh(); return; }
    pending--;
  }
  async function setAgreed(id,p){
    if(p) st.agreed[id]=p; else delete st.agreed[id];
    render();
    try{ await api("acordar",{item:id, p}); }catch(e){ toast("No se pudo guardar la prioridad acordada."); refresh(); }
  }
  async function setHide(v){
    st.hide=v; render();
    try{ await api("ocultar",{valor:v}); }catch(e){ toast("No se pudo cambiar la visibilidad de resultados."); refresh(); }
  }

  // ---------- dialog ----------
  const dlg=$("#dlg");
  function openForm(it){
    st.editingId = it ? it.id : null;
    $("#dlgTitle").textContent = it ? "Editar iniciativa" : "Agregar iniciativa";
    $("#saveBtn").textContent = it ? "Guardar cambios" : "Agregar";
    $("#fFrente").value = it ? it.frente : (st.frente!=="Todos"?st.frente:"");
    $("#fTexto").value = it ? it.texto : "";
    const sel = it ? (it.impulsores||[]) : [];
    $("#fImp").innerHTML = IMPULSORES.map((t,i)=>'<label><input type="checkbox" value="'+esc(t)+'" '+(sel.includes(t)?"checked":"")+'> '+esc(t)+'</label>').join("");
    $("#fErr").textContent="";
    if(typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
    setTimeout(()=>$(it?"#fTexto":"#fFrente").focus(),0);
  }
  $("#cancelBtn").addEventListener("click",()=>dlg.close());
  $("#form").addEventListener("submit", async (ev)=>{
    ev.preventDefault();
    const frente=$("#fFrente").value.trim(), texto=$("#fTexto").value.trim();
    const impulsores=[...document.querySelectorAll("#fImp input:checked")].map(i=>i.value);
    if(!frente||!texto){ $("#fErr").textContent="Completá el frente y la iniciativa."; return; }
    $("#saveBtn").disabled=true;
    try{
      if(st.editingId){ await api("editar",{id:st.editingId,frente,texto,impulsores}); toast("Cambios guardados."); }
      else{ await api("agregar",{frente,texto,impulsores}); toast("Iniciativa agregada."); }
      dlg.close();
    }catch(e){
      $("#fErr").textContent = e.code==="permiso" ? "Solo quien la agregó o el facilitador puede editarla." : e.code==="limite" ? "Se alcanzó el límite de iniciativas." : "No se pudo guardar. Probá de nuevo.";
    }finally{ $("#saveBtn").disabled=false; }
  });

  async function del(id){
    if(!st.items.some(i=>i.id===id)) return;
    if(!confirm("¿Eliminar esta iniciativa? Se pierden también sus votos.")) return;
    try{ await api("borrar",{id}); toast("Iniciativa eliminada."); }
    catch(e){ toast("No se pudo eliminar la iniciativa."); }
  }

  function csv(){
    const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
    const rows=[["Frente","Iniciativa","Impulsor","Votos Alta","Votos Media","Votos Baja","Promedio (1 a 3)","Prioridad acordada","Origen"]];
    st.items.forEach(it=>{ const t=tally(it.id); rows.push([it.frente,it.texto,(it.impulsores||[]).join(" + "),t.c.A,t.c.M,t.c.B,t.n?t.avg.toFixed(2).replace(".",","):"",st.agreed[it.id]?P[st.agreed[it.id]].label:"",it.origen==="taller"?"Taller":"Propuesta inicial"]); });
    const data="\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));
    a.download="priorizacion-riesgos.csv"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
  }

  // ---------- events ----------
  document.addEventListener("click",(e)=>{
    const t=e.target.closest("button"); if(!t) return;
    if(t.dataset.view){ st.view=t.dataset.view; render(); return; }
    if(t.dataset.frente){ st.frente=t.dataset.frente; render(); return; }
    if(t.dataset.vote){ vote(t.dataset.vote,t.dataset.p); return; }
    if(t.dataset.edit){ const it=st.items.find(i=>i.id===t.dataset.edit); if(it) openForm(it); return; }
    if(t.dataset.del){ del(t.dataset.del); return; }
    if(t.id==="addBtn"){ openForm(null); return; }
    if(t.id==="csvBtn"){ csv(); return; }
  });
  document.addEventListener("change",(e)=>{
    const t=e.target;
    if(t.dataset && t.dataset.agree){ setAgreed(t.dataset.agree, t.value); }
    if(t.id==="hideChk"){ setHide(t.checked); }
  });

  // ---------- init ----------
  identity(); render();
  if(!/^https:\/\/script\.google\.com\//.test(API)){ st.status="nocfg"; render(); }
  else{
    refresh();
    setInterval(refresh, POLL_MS);
    document.addEventListener("visibilitychange", refresh);
  }
})();
</script>
</body>
</html>
